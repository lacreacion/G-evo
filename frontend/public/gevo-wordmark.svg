<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 54" fill="none" className="w-auto h-full">
  <defs>
    {/* Gradiente Dorado 3D Metálico para 'G' */}
    <linearGradient id="wordmarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF4B8" />
      <stop offset="25%" stopColor="#F5C226" />
      <stop offset="65%" stopColor="#D8A01A" />
      <stop offset="100%" stopColor="#996500" />
    </linearGradient>

    {/* Gradiente Verde Esmeralda Vibrante para '-evo' */}
    <linearGradient id="wordmarkGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="25%" stopColor="#22C55E" />
      <stop offset="70%" stopColor="#15A658" />
      <stop offset="100%" stopColor="#0B733B" />
    </linearGradient>

    {/* Gradiente Verde Neón para el punto '.' */}
    <linearGradient id="wordmarkNeonDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A7F3D0" />
      <stop offset="30%" stopColor="#00FF44" />
      <stop offset="100%" stopColor="#00D928" />
    </linearGradient>

    <filter id="wordmarkDepth" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" floodColor="#000000" floodOpacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#wordmarkDepth)" transform="translate(-50, 0)">
    {/* Letra 'G' */}
    <path
      d="M 74 10 
         C 83 10, 90 15, 93 23 
         L 85 26 
         C 83 21, 79 18, 74 18 
         C 67 18, 62 24, 62 31 
         C 62 38, 67 44, 74 44 
         C 79 44, 83 41, 85 37 
         L 74 37 
         L 74 30 
         L 94 30 
         L 94 40 
         C 89 47, 82 52, 74 52 
         C 62 52, 52 43, 52 31 
         C 52 19, 62 10, 74 10 Z"
      fill="url(#wordmarkGold)"
    />

    {/* Guión '-' */}
    <rect
      x="100"
      y="28"
      width="16"
      height="6"
      rx="2.5"
      fill="url(#wordmarkGreen)"
    />

    {/* Letra 'e' */}
    <path
      d="M 133 23 
         C 141 23, 147 28, 147 37 
         L 147 39 
         L 126 39 
         C 127 44, 130 47, 136 47 
         C 140 47, 143 45, 145 42 
         L 151 45 
         C 148 50, 142 53, 136 53 
         C 125 53, 118 45, 118 35 
         C 118 25, 125 23, 133 23 Z 
         M 140 33 
         C 140 29, 137 27, 133 27 
         C 129 27, 126 29, 126 33 
         L 140 33 Z"
      fill="url(#wordmarkGreen)"
    />

    {/* Letra 'v' */}
    <path
      d="M 154 24 
         L 162 24 
         L 169 43 
         L 176 24 
         L 184 24 
         L 173 52 
         L 165 52 
         Z"
      fill="url(#wordmarkGreen)"
    />

    {/* Letra 'o' */}
    <path
      d="M 197 23 
         C 206 23, 213 30, 213 38 
         C 213 46, 206 53, 197 53 
         C 188 53, 181 46, 181 38 
         C 181 30, 188 23, 197 23 Z 
         M 197 30 
         C 192 30, 189 34, 189 38 
         C 189 43, 192 46, 197 46 
         C 201 46, 205 43, 205 38 
         C 205 34, 201 30, 197 30 Z"
      fill="url(#wordmarkGreen)"
    />

    {/* Punto '.' */}
    <rect
      x="217"
      y="41"
      width="9"
      height="9"
      rx="2.5"
      fill="url(#wordmarkNeonDot)"
    />
  </g>
</svg>
