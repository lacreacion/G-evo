<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 62" fill="none" className="w-auto h-full">
  <defs>
    <!-- Gradiente Dorado Metalizado Oficial G-evo (Sin tonos negros ni opacos) -->
    <linearGradient id="gevoOfficialGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFF4B8" />
      <stop offset="25%" stopColor="#F5C226" />
      <stop offset="65%" stopColor="#D8A01A" />
      <stop offset="100%" stopColor="#996500" />
    </linearGradient>

    <!-- Gradiente Verde Esmeralda Vibrante Característico Oficial -->
    <linearGradient id="gevoOfficialGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="25%" stopColor="#22C55E" />
      <stop offset="70%" stopColor="#15A658" />
      <stop offset="100%" stopColor="#0B733B" />
    </linearGradient>

    <!-- Gradiente Verde Neón para el punto de acento final -->
    <linearGradient id="gevoOfficialDot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#A7F3D0" />
      <stop offset="35%" stopColor="#00FF44" />
      <stop offset="100%" stopColor="#00D928" />
    </linearGradient>
  </defs>

  <!-- Logotipo Oficial Tipográfico G-evo. (Puro vector, sin iconos extraños ni filtros de desenfoque) -->
  <g>
    <!-- Letra 'G' con Gradiente Dorado Metalizado Oficial -->
    <path
      d="M 28 8 
         C 40 8, 49 15, 52 25 
         L 41 28 
         C 39 21, 34 17, 28 17 
         C 19 17, 12 24, 12 33 
         C 12 42, 19 49, 28 49 
         C 34 49, 40 45, 42 40 
         L 28 40 
         L 28 31 
         L 53 31 
         L 53 43 
         C 48 51, 39 56, 28 56 
         C 14 56, 2 46, 2 33 
         C 2 19, 14 8, 28 8 Z"
      fill="url(#gevoOfficialGold)"
    />

    <!-- Guión '-' con Gradiente Verde Vibrante -->
    <rect
      x="59"
      y="28"
      width="18"
      height="7"
      rx="3"
      fill="url(#gevoOfficialGreen)"
    />

    <!-- Letra 'e' con Gradiente Verde Vibrante -->
    <path
      d="M 99 22 
         C 109 22, 116 28, 116 38 
         L 116 41 
         L 90 41 
         C 91 47, 95 50, 102 50 
         C 107 50, 111 48, 113 45 
         L 120 48 
         C 116 54, 109 57, 102 57 
         C 88 57, 80 47, 80 37 
         C 80 26, 88 22, 99 22 Z 
         M 107 34 
         C 107 29, 104 27, 99 27 
         C 94 27, 91 29, 90 34 
         L 107 34 Z"
      fill="url(#gevoOfficialGreen)"
    />

    <!-- Letra 'v' con Gradiente Verde Vibrante -->
    <path
      d="M 124 23 
         L 134 23 
         L 142 45 
         L 150 23 
         L 160 23 
         L 147 56 
         L 137 56 
         Z"
      fill="url(#gevoOfficialGreen)"
    />

    <!-- Letra 'o' con Gradiente Verde Vibrante -->
    <path
      d="M 174 22 
         C 185 22, 193 30, 193 39 
         C 193 49, 185 57, 174 57 
         C 163 57, 155 49, 155 39 
         C 155 30, 163 22, 174 22 Z 
         M 174 30 
         C 168 30, 165 34, 165 39 
         C 165 45, 168 49, 174 49 
         C 180 49, 183 45, 183 39 
         C 183 34, 180 30, 174 30 Z"
      fill="url(#gevoOfficialGreen)"
    />

    <!-- Punto '.' Neón Verde Brillante -->
    <rect
      x="198"
      y="43"
      width="10"
      height="10"
      rx="3"
      fill="url(#gevoOfficialDot)"
    />
  </g>
</svg>