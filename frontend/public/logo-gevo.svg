<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 56" fill="none" className="w-auto h-full">
  <defs>
    {/* 1. Gradiente Pétalo Superior Izquierdo: Dorado Metálico */}
    <linearGradient id="gevoPetalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF3A8" />
      <stop offset="35%" stopColor="#F5BE18" />
      <stop offset="70%" stopColor="#D8A01A" />
      <stop offset="100%" stopColor="#9E6E00" />
    </linearGradient>

    {/* 2. Gradiente Pétalo Superior Derecho: Verde Esmeralda */}
    <linearGradient id="gevoPetalGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#86EFAC" />
      <stop offset="30%" stopColor="#22C55E" />
      <stop offset="75%" stopColor="#15A658" />
      <stop offset="100%" stopColor="#065F36" />
    </linearGradient>

    {/* 3. Gradiente Pétalo Inferior Izquierdo: Plata / Blanco Perlado */}
    <linearGradient id="gevoPetalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#F1F5F9" />
      <stop offset="75%" stopColor="#CBD5E1" />
      <stop offset="100%" stopColor="#94A3B8" />
    </linearGradient>

    {/* 4. Gradiente Pétalo Inferior Derecho: Pizarra / Carbón Metalizado */}
    <linearGradient id="gevoPetalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#94A3B8" />
      <stop offset="35%" stopColor="#64748B" />
      <stop offset="70%" stopColor="#475569" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    {/* 5. Gradiente Dorado 3D para la letra G */}
    <linearGradient id="gevoTextGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF4B8" />
      <stop offset="25%" stopColor="#F5C226" />
      <stop offset="65%" stopColor="#D8A01A" />
      <stop offset="100%" stopColor="#996500" />
    </linearGradient>

    {/* 6. Gradiente Verde Esmeralda 3D para 'evo' y el guión */}
    <linearGradient id="gevoTextGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="25%" stopColor="#22C55E" />
      <stop offset="70%" stopColor="#15A658" />
      <stop offset="100%" stopColor="#0B733B" />
    </linearGradient>

    {/* 7. Gradiente Verde Neón para el punto '.' */}
    <linearGradient id="gevoDotNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A7F3D0" />
      <stop offset="30%" stopColor="#00FF44" />
      <stop offset="100%" stopColor="#00D928" />
    </linearGradient>

    {/* Filtro sutil de profundidad suave */}
    <filter id="gevoCrispDepth" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" floodColor="#000000" floodOpacity="0.25" />
    </filter>
  </defs>

  {/* ========================================================
      SÍMBOLO: Trébol de 4 Pétalos Tridimensional (Ultra Nítido)
      ======================================================== */}
  <g transform="translate(26, 28)" filter="url(#gevoCrispDepth)">
    {/* Pétalo Superior Izquierdo: Dorado */}
    <path
      d="M -2 -2 C -4 -11, -12 -17, -19 -15 C -23 -14, -24 -9, -21 -4 C -18 3, -9 2, -2 -2 Z"
      fill="url(#gevoPetalGold)"
    />
    
    {/* Pétalo Superior Derecho: Verde Esmeralda */}
    <path
      d="M 2 -2 C 4 -11, 12 -17, 19 -15 C 23 -14, 24 -9, 21 -4 C 18 3, 9 2, 2 -2 Z"
      fill="url(#gevoPetalGreen)"
    />

    {/* Pétalo Inferior Izquierdo: Plata */}
    <path
      d="M -2 2 C -4 11, -12 17, -19 15 C -23 14, -24 9, -21 4 C -18 -3, -9 -2, -2 2 Z"
      fill="url(#gevoPetalSilver)"
    />

    {/* Pétalo Inferior Derecho: Carbón */}
    <path
      d="M 2 2 C 4 11, 12 17, 19 15 C 23 14, 24 9, 21 4 C 18 -3, 9 -2, 2 2 Z"
      fill="url(#gevoPetalDark)"
    />
  </g>

  {/* ========================================================
      LOGOTIPO: 'G-evo.' Vectorial Puro con Definición Retina
      ======================================================== */}
  <g filter="url(#gevoCrispDepth)">
    {/* Letra 'G' Dorada Metálica */}
    {/* Anillo exterior y espolón central horizontal */}
    <path
      d="M 78 12 
         C 87 12, 94 17, 97 25 
         L 89 28 
         C 87 23, 83 20, 78 20 
         C 71 20, 66 26, 66 33 
         C 66 40, 71 46, 78 46 
         C 83 46, 87 43, 89 39 
         L 78 39 
         L 78 32 
         L 98 32 
         L 98 42 
         C 93 49, 86 54, 78 54 
         C 66 54, 56 45, 56 33 
         C 56 21, 66 12, 78 12 Z"
      fill="url(#gevoTextGold)"
    />

    {/* Guión '-' Verde Esmeralda */}
    <rect
      x="104"
      y="30"
      width="16"
      height="6"
      rx="2.5"
      fill="url(#gevoTextGreen)"
    />

    {/* Letra 'e' Verde Esmeralda */}
    <path
      d="M 137 25 
         C 145 25, 151 30, 151 39 
         L 151 41 
         L 130 41 
         C 131 46, 134 49, 140 49 
         C 144 49, 147 47, 149 44 
         L 155 47 
         C 152 52, 146 55, 140 55 
         C 129 55, 122 47, 122 37 
         C 122 27, 129 25, 137 25 Z 
         M 144 35 
         C 144 31, 141 29, 137 29 
         C 133 29, 130 31, 130 35 
         L 144 35 Z"
      fill="url(#gevoTextGreen)"
    />

    {/* Letra 'v' Verde Esmeralda */}
    <path
      d="M 158 26 
         L 166 26 
         L 173 45 
         L 180 26 
         L 188 26 
         L 177 54 
         L 169 54 
         Z"
      fill="url(#gevoTextGreen)"
    />

    {/* Letra 'o' Verde Esmeralda */}
    <path
      d="M 201 25 
         C 210 25, 217 32, 217 40 
         C 217 48, 210 55, 201 55 
         C 192 55, 185 48, 185 40 
         C 185 32, 192 25, 201 25 Z 
         M 201 32 
         C 196 32, 193 36, 193 40 
         C 193 45, 196 48, 201 48 
         C 205 48, 209 45, 209 40 
         C 209 36, 205 32, 201 32 Z"
      fill="url(#gevoTextGreen)"
    />

    {/* Punto '.' Verde Neón Brillante */}
    <rect
      x="221"
      y="43"
      width="9"
      height="9"
      rx="2.5"
      fill="url(#gevoDotNeon)"
    />
  </g>
</svg>
